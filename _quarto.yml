project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    # 16S Sanger trace QC + assembly. Feeds 02_bac_taxonomy.
    - scripts/01_sanger_seq/01_trace_qc_assembly.qmd
    # Bacterial isolate taxonomy from SILVA ACT classification of 01's output.
    - scripts/02_bac_taxonomy/01_taxonomy_summary.qmd
    # Duckweed species barcode genotyping (independent of 01/02).
    - scripts/03_duckweed_genotyping/01_read_format_sanger.qmd
    # Coculture frond-area growth. 01 feeds 02.
    - scripts/04_lemna_bacteria_coculture_frondarea/01_read_frondarea.qmd
    - scripts/04_lemna_bacteria_coculture_frondarea/02_growth_model.qmd

website:
  title: "duckweedSynCom"
  navbar:
    search: true
    tools:
      - icon: bluesky
        href: https://bsky.app/profile/slhogle.bsky.social
      - icon: github
        href: https://github.com/slhogle/duckweedSynCom
    left:
      - sidebar:bac_genotype
      - sidebar:dw_genotyping
      - sidebar:frondarea

  sidebar:
  - id: bac_genotype
    title: "Bacteria genotyping"
    style: "docked"
    contents:
    - text: "01.A Trace QC + assembly"
      href: scripts/01_sanger_seq/01_trace_qc_assembly.qmd
    - text: "01.B Taxonomy + phylogeny"
      href: scripts/02_bac_taxonomy/01_taxonomy_summary.qmd
  - id: dw_genotyping
    title: "Duckweed genotyping"
    style: "docked"
    contents:
    - text: "02.A Sanger Duckweed genotype"
      href: scripts/03_duckweed_genotyping/01_read_format_sanger.qmd
  - id: frondarea
    title: "Coculture frond area"
    style: "docked"
    contents:
    - text: "03.A Read + format frond area"
      href: scripts/04_lemna_bacteria_coculture_frondarea/01_read_frondarea.qmd
    - text: "03.B Bayesian growth model"
      href: scripts/04_lemna_bacteria_coculture_frondarea/02_growth_model.qmd

format:
  html:
    fig-format: svg
    theme:
      light: flatly
      dark: darkly
    toc: true
    # when printing dataframes use rmarkdown::paged_table())
    df-print: paged
    # set default dimensions for figures
    fig-width: 8
    fig-height: 6
    # tidy format R code upon render.
    # NOTE: kept false (hambiEvoEnvCoexist uses true). Code in this project is
    # formatted with air (see air.toml); letting formatR rewrite it on render
    # would fight that and can mangle native pipes.
    tidy: false
    # include line numbers in code blocks
    code-line-numbers: true
    number-sections: true
    code-fold: show
    code-summary: "Show/hide code"
    code-tools: true

execute:
  freeze: auto        # Default: saving intermediate files to make project rendering faster
  echo: true          # Default: Shows the source code in the output
  eval: true          # Default: Runs the code
  # Matches MCTdownUnder: output is suppressed by default, and shown only
  # where a chunk explicitly opts in with `#| output: true` (every chunk
  # whose result should appear on the page has been audited to set this).
  output: false       # Default: Suppresses output from running the code
  warning: false      # Default: Suppresses warnings
  message: false      # Default: Suppresses messages

editor: source
